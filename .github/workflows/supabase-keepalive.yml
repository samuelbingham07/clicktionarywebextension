name: Supabase keep-alive

# Free-tier Supabase projects pause after 7 days without "sufficient activity".
# A read-only select every 3 days wasn't enough (project paused 2026-10-06),
# so this now runs daily and calls keepalive(), which writes a timestamp.
# keepalive() is created by supabase/keepalive.sql; run that once in the
# Supabase SQL editor. If it's missing, this job fails and GitHub emails you.
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write heartbeat to Supabase
        env:
          SUPABASE_URL: https://incvqtbkfntzdvbingqv.supabase.co
          # Public anon key, same one shipped in background.js
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImluY3ZxdGJrZm50emR2YmluZ3F2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzMTc3NzAsImV4cCI6MjA4OTg5Mzc3MH0.QCIoHwvt41QcLJ3ilSezTntNGzXyFFpHQf-7kz6mKzU
        run: |
          curl --fail -sS -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
