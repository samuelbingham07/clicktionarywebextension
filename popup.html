<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clicktionary</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 280px;
      background: #ffffff;
      color: #222222;
      font-family: Georgia, 'Times New Roman', serif;
    }

    .header {
      background: #fffde7;
      padding: 16px 18px 14px;
      border-bottom: 2px solid #f5e642;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: #f5e642;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .logo-text {
      font-size: 20px;
      font-weight: bold;
      color: #222;
      letter-spacing: -0.02em;
    }

    .logo-text span { color: #b8a000; }

    /* ── Auth Panel ── */
    #authPanel {
      padding: 20px 18px;
    }

    .auth-title {
      font-size: 14px;
      font-weight: bold;
      color: #222;
      margin-bottom: 4px;
    }

    .auth-sub {
      font-size: 11px;
      color: #888;
      font-family: Arial, sans-serif;
      margin-bottom: 14px;
    }

    .auth-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #222;
      margin-bottom: 8px;
      outline: none;
      transition: border-color 0.15s;
    }

    .auth-input:focus { border-color: #f5e642; }

    .auth-btn {
      width: 100%;
      background: #f5e642;
      color: #333;
      border: none;
      border-radius: 6px;
      padding: 9px;
      font-size: 13px;
      font-family: Arial, sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 6px;
    }

    .auth-btn:hover { background: #e6d800; }

    .auth-btn.secondary {
      background: none;
      border: 1px solid #e0e0e0;
      color: #666;
    }

    .auth-btn.secondary:hover { background: #f9f9f9; }

    .auth-error {
      font-size: 11px;
      color: #e53935;
      font-family: Arial, sans-serif;
      margin-bottom: 8px;
      display: none;
    }

    .auth-success {
      font-size: 11px;
      color: #4caf50;
      font-family: Arial, sans-serif;
      margin-bottom: 8px;
      display: none;
    }

    .auth-toggle {
      text-align: center;
      font-size: 11px;
      color: #888;
      font-family: Arial, sans-serif;
      margin-top: 4px;
    }

    .auth-toggle a {
      color: #b8a000;
      cursor: pointer;
      text-decoration: underline;
    }

    /* ── Main Panel ── */
    #mainPanel { display: none; }

    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 18px;
      background: #fffde7;
      border-bottom: 1px solid #f5f0c0;
    }

    .user-email {
      font-size: 10px;
      color: #888;
      font-family: Arial, sans-serif;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 180px;
    }

    .signout-btn {
      font-size: 10px;
      color: #b8a000;
      font-family: Arial, sans-serif;
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      flex-shrink: 0;
    }

    .stats {
      padding: 14px 18px;
      display: flex;
      gap: 12px;
    }

    .stat {
      flex: 1;
      background: #fffde7;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      border: 1px solid #f5e642;
    }

    .stat-number {
      font-size: 22px;
      font-weight: bold;
      color: #b8a000;
    }

    .stat-label {
      font-size: 10px;
      color: #888;
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 2px;
    }

    .recent {
      padding: 0 18px 14px;
    }

    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #aaa;
      font-family: Arial, sans-serif;
      margin-bottom: 8px;
    }

    .word-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .word-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fffde7;
      border-radius: 6px;
      padding: 7px 10px;
      border-left: 2px solid #f5e642;
    }

    .word-es {
      font-size: 13px;
      color: #222;
      font-weight: bold;
    }

    .word-en {
      font-size: 11px;
      color: #888;
      font-family: Arial, sans-serif;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
    }

    .empty-state {
      text-align: center;
      padding: 12px;
      color: #bbb;
      font-size: 12px;
      font-family: Arial, sans-serif;
      font-style: italic;
    }

    .footer {
      padding: 12px 18px;
      border-top: 1px solid #f5f0c0;
    }

    .open-btn {
      width: 100%;
      background: #f5e642;
      color: #333;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      font-family: Arial, sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .open-btn:hover { background: #e6d800; }

    .tip {
      margin-top: 8px;
      font-size: 10px;
      color: #bbb;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #bbb;
      font-family: Arial, sans-serif;
      font-size: 12px;
    }
      padding: 10px 18px 14px;
      border-top: 1px solid #f5f0c0;
    }

    .lang-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #aaa;
      font-family: Arial, sans-serif;
      margin-bottom: 8px;
    }

    .lang-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }

    .lang-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 2px;
      border-radius: 6px;
      border: 1.5px solid transparent;
      background: #f9f9f9;
      cursor: pointer;
      transition: all 0.15s;
      font-family: Arial, sans-serif;
    }

    .lang-btn .flag { font-size: 16px; }
    .lang-btn .code { font-size: 9px; color: #888; font-weight: 600; letter-spacing: 0.05em; }

    .lang-btn:hover { background: #fffde7; border-color: #f5e642; }
    .lang-btn.active { background: #fffde7; border-color: #f5e642; }
    .lang-btn.active .code { color: #b8a000; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🔍</div>
      <div>
        <div class="logo-text">Click<span>tionary</span></div>
      </div>
    </div>
  </div>

  <!-- Loading state -->
  <div id="loadingPanel" class="loading">Loading...</div>

  <!-- Auth Panel (signed out) -->
  <div id="authPanel" style="display:none">
    <div class="auth-title" id="authTitle">Sign in to Clicktionary</div>
    <div class="auth-sub">Your word bank syncs across all your devices</div>
    <div class="auth-error" id="authError"></div>
    <div class="auth-success" id="authSuccess"></div>
    <input class="auth-input" id="emailInput" type="email" placeholder="Email" />
    <input class="auth-input" id="passwordInput" type="password" placeholder="Password" />
    <button class="auth-btn" id="authSubmit">Sign In</button>
    <div class="auth-toggle">
      <span id="authToggleText">Don't have an account?</span>
      <a id="authToggleLink">Sign Up</a>
    </div>
  </div>

  <!-- Main Panel (signed in) -->
  <div id="mainPanel">
    <div class="user-bar">
      <span class="user-email" id="userEmail"></span>
      <button class="signout-btn" id="signOutBtn">Sign out</button>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-number" id="totalWords">0</div>
        <div class="stat-label">Words Saved</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="masteredWords">0</div>
        <div class="stat-label">Mastered</div>
      </div>
    </div>

    <div class="recent">
      <div class="section-title">Recently Added</div>
      <div class="word-list" id="wordList">
        <div class="empty-state">No words yet — highlight some Spanish text!</div>
      </div>
    </div>

    <div class="lang-section">
      <div class="lang-label">Learning Language</div>
      <div class="lang-grid" id="langGrid"></div>
    </div>

    <div class="footer">
      <button class="open-btn" id="openWordBank">Open Word Bank & Practice →</button>
      <div class="tip">Highlight Spanish text on any webpage to save words</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
